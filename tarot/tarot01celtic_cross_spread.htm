// 軽量シャッフル（配列の後半半分だけシャッフル）★
function lightShuffle(array) {
    const mid = Math.floor(array.length / 2);
    for (let i = array.length - 1; i >= mid; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// デスクトップドラッグ開始（親 .card を必ず取得する）
let dragOffsetX = 0;
let dragOffsetY = 0;

// デスクトップドラッグ開始（親 .card を必ず取得する）
function handleDragStart(e) {
    const card = e.target.closest('.card');
    if (!card) return;

    draggedCard = card;
    draggedIndex = parseInt(card.dataset.index, 10);

    // マウス位置とカード位置の差分を記録
    const rect = card.getBoundingClientRect();
    dragOffsetX = e.clientX - rect.left;
    dragOffsetY = e.clientY - rect.top;

    card.classList.add('dragging');

    // ブラウザ既定のドラッグイメージを消す
    const img = new Image();
    img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
    e.dataTransfer.setDragImage(img, 0, 0);
    e.dataTransfer.setData('text/plain', String(draggedIndex));
    e.dataTransfer.effectAllowed = 'move';
}

function handleDragEnd(e) {
    const card = e.target.closest('.card') || draggedCard;
    if (card && card.classList.contains('dragging')) {
        card.classList.remove('dragging');
    }
    draggedCard = null;
    draggedIndex = -1;
}

// モバイルタッチ開始★
function handleTouchStart(e) {
    e.preventDefault();
    const touch = e.touches[0];
    // imgタグをタッチしたときも.cardを取得
    draggedCard = e.target.closest('.card');
    if (!draggedCard) return;
    draggedIndex = parseInt(draggedCard.dataset.index);
    draggedCard.classList.add('dragging');

    const rect = draggedCard.getBoundingClientRect();
    initialX = touch.clientX - rect.left;
    initialY = touch.clientY - rect.top;
}

// モバイルタッチ移動★
function handleTouchMove(e) {
    if (!draggedCard) return;
    e.preventDefault();
    const touch = e.touches[0];
    const table = document.getElementById('table');
    const tableRect = table.getBoundingClientRect();

    // 現在のタッチ位置に合わせてカードを動かす
    let newX = touch.clientX - tableRect.left - initialX;
    let newY = touch.clientY - tableRect.top - initialY;

    // 境界チェック（カードがはみ出ないように）
    newX = Math.max(0, Math.min(newX, tableRect.width - draggedCard.offsetWidth));
    newY = Math.max(0, Math.min(newY, tableRect.height - draggedCard.offsetHeight));

    draggedCard.style.left = `${newX}px`;
    draggedCard.style.top = `${newY}px`;
}

// モバイルタッチ終了（ドロップ処理）★
function handleTouchEnd(e) {
    if (!draggedCard) return;
    e.preventDefault();
    draggedCard.classList.remove('dragging');

    // 軽量シャッフルと全カードの再配置（バラバラ効果）
    lightShuffle(cards);
    const table = document.getElementById('table');
    const tableRect = table.getBoundingClientRect();
    cardElements.forEach((el, i) => {
        const newX = Math.random() * (tableRect.width - 50);
        const newY = Math.random() * (tableRect.height - 85);
        const angle = (Math.random() * 60) - 30; // -30〜+30度のランダム回転
        el.style.left = `${newX}px`;
        el.style.top = `${newY}px`;
        el.style.transform = `rotate(${angle}deg)`; // ←追加！
        el.dataset.index = i;
    });

    draggedCard = null;
    draggedIndex = -1;
}

// ドロップゾーンイベント（デスクトップ用）★
const table = document.getElementById('table');
// デスクトップ中のドラッグ移動
table.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (!draggedCard) return;

    const rect = table.getBoundingClientRect();
    let newX = e.clientX - rect.left - dragOffsetX;
    let newY = e.clientY - rect.top - dragOffsetY;

    newX = Math.max(0, Math.min(newX, rect.width - draggedCard.offsetWidth));
    newY = Math.max(0, Math.min(newY, rect.height - draggedCard.offsetHeight));

    draggedCard.style.left = `${newX}px`;
    draggedCard.style.top = `${newY}px`;
});
table.addEventListener('drop', handleDrop);

// ドロップ完了後のシャッフル
function handleDrop(e) {
  e.preventDefault();
  const target = e.target.closest('.card');
  const draggedIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);

  // ドロップ時のカード入れ替え処理（もし使っていれば）
  if (target && target.dataset.index !== undefined) {
    const targetIndex = parseInt(target.dataset.index, 10);
    const temp = cards[draggedIndex];
    cards[draggedIndex] = cards[targetIndex];
    cards[targetIndex] = temp;
  }

  // ドラッグ中のスタイル解除
  const dragging = document.querySelector('.dragging');
  if (dragging) dragging.classList.remove('dragging');

  // ここを追加：「ドロップしたら全カードを散らす」
  setTimeout(scatterCards, 300);
}

    // Fisher-Yatesシャッフルアルゴリズムで配列をシャッフル
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
