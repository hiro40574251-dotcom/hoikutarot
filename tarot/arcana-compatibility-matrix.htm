            { id: 14, name: "調和", latin: "HARMONIA", dmin: "人間関係", philo: "「調和は一人ではなく、互いを尊重し合うことで生まれる」という哲学を示しています。", regpo: "協力と共鳴: 子ども同士が互いを尊重し、協力しながら活動できている。/ 心のつながり: 感情や思いが共鳴し合い、安心感と信頼関係が育まれている。/ バランスの取れた成長: 遊び・学び・休息のリズムが調和し、心身が健やかに育っている。/ 美しい循環: 音楽のように、個々の違いが合わさって一つの調和を生み出す。", revpo: "不協和音: 子ども同士の関係に摩擦や対立が生じ、協力が難しくなる。/ 孤立や断絶: 調和が崩れ、誰かが仲間から外れてしまう。/ アンバランスな成長: 遊びや学びの偏りが強く、心身のバランスが乱れる。/ 強制された調和: 表面的にはまとまって見えても、内面では無理や我慢が積み重なっている。", design: "二人の子どもが一つのリラ（竪琴）を共に持ち、音を奏でる姿。これは「協力」「共鳴」「心の調和」を象徴します。/ 背景の自然要素: 太陽 - 生命力と明るさ、調和を照らす光。木 - 左右対称に枝を広げ、安定とバランスを象徴。草花 - 小さな芽や花が「調和の中で育つ成長」を示します。/ 音楽の象徴: 子どもたちが奏でるリラは「調和の音」を可視化し、共に生きる喜びを表現。", img: "14", vector: [0.65 , 0.50 , 0.95 , 0.70 , 0.60 , 0.75 , 0.80 , 0.80 , 0.50 , 0.65 , 0.85 , 0.55 , 0.30 , 0.75 , 0.95 ] },
            { id: 15, name: "素材", latin: "MATERIA", dmin: "環境", philo: "「素材は子どもの創造の入口であり、世界とつながる手がかりである」という哲学を示しています。", regpo: "探究心の芽生え: 子どもが素材に触れ、試行錯誤しながら新しい発見をしている。/ 創造の源泉: 石・木・水・粘土など、素材そのものが遊びや学びの出発点となる。/ 五感を通じた学び: 触る・見る・匂う・音を聞くといった感覚を通じて、世界を理解する力が育つ。/ 自然とのつながり: 素材を通じて自然の循環や恵みを感じ取り、生命への敬意を育む。", revpo: "表面的な関わり: 素材をただ消費するだけで、探究や創造につながらない。/ 過剰な制限: 素材に触れる機会が制限され、子どもの自由な探究が妨げられる。/ 混乱や危険: 素材の扱い方が未熟で、散らかしや危険につながる。/ 自然からの断絶: 人工的なものに偏り、自然素材との出会いが乏しくなる。", design: "中央の子ども: 自然素材（木・石・水・粘土など）を前にして遊び、積み重ねたり形を作ったりする姿。これは「素材を通じて世界を理解し、創造する力」を象徴します。/ 自然の要素: 木 - 成長と生命力の源。石 - 安定と基盤。水 - 流動性と変化。粘土 - 形を変えられる可能性と創造性。/ 背景の象徴: 山や川、太陽の光が描かれ、素材が自然から生まれ、子どもの手で新しいものへと変わっていく循環を示しています。", img: "15", vector: [0.85 , 0.85 , 0.60 , 0.85 , 0.70 , 0.60 , 0.90 , 0.70 , 0.95 , 0.65 , 0.70 , 0.75 , 0.30 , 0.80 , 0.60 ] },
            { id: 16, name: "葛藤", latin: "CONFLICTVS", dmin: "人間関係", philo: "「葛藤は避けるべきものではなく、成長の契機である」という哲学を示しています。", regpo: "成長の契機: 子ども同士の衝突が、互いを理解し合うきっかけとなる。/ 対話と調整: 意見の違いを通じて、譲り合いや交渉の力を学ぶ。/ 感情の表現: 怒りや不満を安全な場で表現し、受け止めてもらう経験。/ 社会性の芽生え: 「自分」と「他者」の違いを知り、関係性を築く力が育つ。", revpo: "対立の激化: 意見の違いが解決されず、仲間外れや疎外感につながる。/ 感情の抑圧: 不満を表に出せず、内にため込んでしまう。/ 解決の停滞: 対話や仲裁が機能せず、行き詰まりを感じる。/ 孤立感: 見守りや支えが不足し、葛藤が「孤独な体験」となってしまう。", design: "中央の子どもたち: 二人の子どもが一つの玩具をめぐって向かい合う姿。表情は怒りや不満ではなく「葛藤の瞬間」を示し、成長の一部として描かれています。/ 第三の存在: 背景に控えめに描かれる子どもや大人が「見守り」「仲裁」「安心の場」を象徴。葛藤が孤立ではなく、支えの中で経験されることを示します。/ 背景の自然要素: 分かれた木 - 片方は青々と茂り、もう片方は葉を落とす。対立する二つの側面を象徴。雲と光 - 曇り空の中に差し込む光が「葛藤の中にある希望と解決の可能性」を示します。", img: "16", vector: [0.70 , 0.50 , 0.85 , 0.75 , 0.40 , 0.60 , 0.70 , 0.70 , 0.20 , 0.40 , 0.30 , 0.80 , 0.95 , 0.50 , 0.75 ] },
            { id: 17, name: "慰め", latin: "CONSOLATIO", dmin: "情緒", philo: "「共感と支えの中で感情を整理するプロセス」を示しています。", regpo: "共感と寄り添い: 子どもの悲しみや不安を受け止め、安心感を与える。/ 感情の回復: 涙や不安が落ち着き、心が少しずつ和らいでいく。/ 支え合いの関係: 仲間や大人の存在が「一人ではない」という安心を育む。/ 安心の場の形成: 保育の場が「感情を表現しても受け止めてもらえる場所」であることを示す。", revpo: "孤立感: 悲しみや不安を抱えても、十分に受け止めてもらえず孤独を感じる。/ 表面的な慰め: 形だけの声かけで、子どもの心に届かない。/ 感情の抑圧: 泣くことや弱さを表すことが否定され、感情を内に閉じ込めてしまう。/ 依存の危うさ: 慰めが過剰になり、自分で感情を整理する力が育ちにくくなる。", design: "中央の子どもと大人: 泣いている子どもに寄り添い、肩に手を置いたり抱きしめたりする姿。これは「悲しみを分かち合い、安心を与える力」を象徴します。/ 表情の変化: 子どもの涙と、大人の穏やかな微笑み。感情が「悲しみから落ち着きへ」と移ろう瞬間を描いています。/ 背景の自然要素: 夕暮れの空 - 一日の終わりに訪れる静けさと、心の落ち着きを象徴。木と鳥 - 見守りと希望の象徴。枝にとまる鳥は「慰めの声」を表します。花や草 - 小さな命が寄り添うように咲き、安心の場を強調。/ 小道具: ぬいぐるみや温かい飲み物が描かれ、子どもにとっての「安心の象徴」として機能します。", img: "17", vector: [0.40 , 0.30 , 0.75 , 0.60 , 0.40 , 0.70 , 0.75 , 0.85 , 0.30 , 0.50 , 0.95 , 0.30 , 0.50 , 0.60 , 0.85 ] },
            { id: 18, name: "物語", latin: "NARRATIO", dmin: "言葉/表現", philo: "「物語は子どもの心を広げ、仲間とつながる力を持つ」という哲学を示しています。", regpo: "想像力の翼: 絵本やごっこ遊びを通じて、子どもが自由に物語を紡ぎ、世界を広げる。/ 共感と役割理解: 劇遊びやごっこ遊びで他者の立場を演じることで、共感や社会性が育まれる。/ 言葉と表現の豊かさ: 物語を語り、聞き、演じることで、言葉や表現力が自然に育つ。/ 共同の楽しみ: 仲間と一緒に物語を作り上げることで、協力や一体感が生まれる。", revpo: "想像の停滞: 物語や遊びに入り込めず、想像力が閉じてしまう。/ 役割の固定化: ごっこ遊びで特定の役割ばかりを押し付けられ、自由さが失われる。/ 孤立感: 仲間の物語に入り込めず、一人だけ外れてしまう。/ 表現の抑圧: 自分の物語や表現を否定され、言葉や想像を出しにくくなる。", design: "中央の子どもたち: 一人は絵本を読み聞かせるように本を手にし、もう一人は人形や仮面を使って劇遊びを演じる姿。これは「物語を共有する力」「想像を形にする力」を象徴します。/ ごっこ遊びの要素: 子どもたちが王冠や帽子をかぶったり、簡単な衣装をまとって役になりきる姿が描かれています。これは「役割を通じて他者を理解する力」を示します。/ 背景の自然要素: 星や月 - 想像力と夢の世界。木に刻まれた模様 - 物語の中で命を持つ象徴的存在。鳥や動物 - 物語の仲間として登場する象徴。/ 小道具の象徴: 絵本 - 知恵や伝承の象徴。人形やパペット - 物語を具体的に表現する道具。小さな舞台や幕 - 劇遊びの空間を示す。", img: "18", vector: [0.70 , 0.60 , 0.80 , 0.90 , 0.50 , 0.65 , 0.85 , 0.75 , 0.60 , 0.60 , 0.75 , 0.70 , 0.35 , 0.80 , 0.80 ] },
            { id: 19, name: "創造的自由", latin: "LIBERTAS CREATIVA", dmin: "表現", philo: "子どもが自らの内なる世界を外に表現することで、自己理解と他者とのつながりが育まれます。「創造とは、評価されるための手段ではなく、心を解き放ち、世界とつながるための営みである」という哲学を示しています。", regpo: "自由な表現の喜び: 子どもが自分のペースで、好きな方法で創造を楽しんでいる状態。/ 想像力の羽ばたき: 絵、音、動きなどを通じて、内なる世界を広げている。/ 遊びの中の探究: 手を使い、素材と向き合いながら、世界の仕組みを自分なりに理解している。/ 心の解放と安心感: 評価や制約から離れ、のびのびと自分を表現できている。", revpo: "表現の抑圧: 自由に描いたり遊んだりすることが否定され、自己表現が萎縮している。/ 想像力の停滞: 遊びが型にはまり、創造の喜びが失われている。/ 過剰な干渉や管理: 大人の期待や枠組みによって、子どもの自由な創作が妨げられている。/ 自己否定の芽生え: 自分の表現が受け入れられないことで、自信を失っている。", design: "中央の子ども: 草原に座り、絵筆を振るいながら歌う姿。目を閉じて口を開き、腕を広げて「創造の歓び」に満ちた表情。/ 周囲にはクレヨン、絵筆、楽器（タンバリン・鈴）、布切れなどが散らばり、自由な創作の場が広がっている。/ 描いている絵には「笑顔の太陽」が描かれ、子どもの内なる光と創造の源泉を象徴。/ 背景の自然要素: 太陽と月が同時に描かれる空：昼と夜の境界を超えた「無限の可能性」を象徴。/ 鳥と蝶 - 自由に羽ばたく想像力。空を舞いながら、創造の空気を運ぶ。/ 木に結ばれたリボンや飾り - 遊びと創造の祝祭性。風に揺れるリボンが、創作のリズムを感じさせる。/ 丘と水辺 - 自然の広がりと創造の舞台。/ 色彩と構図: 赤・青・黄・緑の原色が強調され、子どもの創造力の鮮やかさを表現。", img: "19", vector: [0.98 , 0.90 , 0.60 , 0.95 , 0.70 , 0.40 , 0.98 , 0.60 , 0.85 , 0.65 , 0.70 , 0.85 , 0.35 , 0.90 , 0.65 ] },
            { id: 20, name: "収集", latin: "COLLECTIO", dmin: "環境", philo: "「収集とは、世界を自分なりに理解し、秩序を与える行為である」。子どもが小さな宝物を集め、分類し、意味づけることで、世界との関係性を築き、記憶と感情を整理していく力を育みます。", regpo: "好奇心の芽生え: 子どもが身の回りの世界に興味を持ち、小さな発見を大切にしている。/ 秩序づけの力: 集めたものを分類・整理することで、世界の構造を自分なりに理解しようとしている。/ 記憶と意味づけ: 収集したものに名前をつけたり、物語を与えたりすることで、記憶と感情が結びついていく。/ 安心と愛着の形成: お気に入りのものを集めることで、自己の世界が育まれ、安心感が得られる。", revpo: "混乱と過剰: 集めすぎて整理できず、秩序よりも混乱が生まれている。/ 執着と手放せなさ: 物へのこだわりが強くなり、手放すことに不安を感じている。/ 外的価値への依存: 自分の興味よりも「評価されるもの」を集めようとしてしまう。/ 孤立感: 収集が他者との共有ではなく、閉じた世界になってしまっている。", design: "中央の子ども: 籠に宝物を集める姿。葉っぱ、貝殻、小石、ぬいぐるみなどを手に取り、真剣な表情で分類・収集している。表情は好奇心に満ち、集中している。収集行為が「世界を理解する手段」であることを象徴。/ 周囲のモチーフ - 貝殻や小石：自然の中の発見と触覚的な魅力。/ ぬいぐるみや小物：安心と愛着の対象。/ 蝶や小鳥：移ろいゆく瞬間を「集める」象徴。/ 小さな棚や壺：集めたものを整理し、意味づける行為。分類と記憶の可視化。/ 背景の自然要素 - 木に吊るされた札やリボン：記憶や記録の象徴。収集したものに意味を与える行為。/ 曇り空と差し込む光：混沌の中から秩序を見出す収集の力。", img: "20", vector: [0.80 , 0.85 , 0.50 , 0.60 , 0.60 , 0.60 , 0.80 , 0.70 , 0.75 , 0.65 , 0.70 , 0.65 , 0.25 , 0.75 , 0.55 ] },
            { id: 21, name: "祝祭", latin: "CELEBRATIO", dmin: "表現", philo: "「祝祭は達成を祝うだけでなく、仲間と喜びを分かち合うことで心を育てる場である」という哲学を示しています。", regpo: "努力の成果を仲間と分かち合う喜び。/ 自分の存在が認められ、誇りを感じる瞬間。/ 仲間の達成を祝うことで、共感と絆が深まる。/ 保育の中での節目や成長を祝う大切な場面。", revpo: "達成が認められず、孤独や不満を感じる。/ 祝うことが形式的になり、心が置き去りになる。/ 他者との比較によって自己否定が生まれる。/ 過剰な期待や注目がプレッシャーになる。", design: "中央の子どもたち: 舞台の上で歌ったり踊ったりする子ども、誕生日の冠をかぶってケーキを囲む子ども、賞状を手に笑顔を見せる子どもなどが描かれ、「達成と祝福の瞬間」を象徴します。/ 背景の装飾: ガーランドや花飾り - 祝祭の空間を彩る象徴。星と太陽 - 輝きと注目の象徴。鳥や風船 - 自由と高揚感の象徴。/ 小道具の象徴: 楽器（太鼓・笛・鈴） - 発表会の音楽的要素。ケーキや果物 - 誕生会の歓びと分かち合い。賞状・メダル・王冠 - 達成の証と誇り。", img: "21", vector: [0.65 , 0.50 , 0.85 , 0.90 , 0.70 , 0.80 , 0.65 , 0.75 , 0.70 , 0.50 , 0.75 , 0.85 , 0.30 , 0.95 , 0.88 ] },
            { id: 22, name: "遊び", latin: "LVDVS", dmin: "全般", philo: "「遊びとは、子どもが世界と出会い、自分自身を表現し、関係を築くための最も根源的な営みである」。遊びは単なる娯楽ではなく、感覚・運動・言語・社会性・創造性のすべてを統合する保育の中心概念です。", regpo: "自発性と創造性の発揮: 子どもが自ら遊びを生み出し、自由に展開している状態。/ 発達の統合的促進: 感覚・運動・言語・社会性・情緒が遊びの中で自然に育まれている。/ 安心と関係性の中での遊び: 信頼できる場で、他者との関わりを通じて遊びが深まっている。/ 遊びを通じた世界理解: 模倣・構築・ごっこ遊びなどを通じて、子どもが世界を探索している。", revpo: "遊びの停滞や形式化: 自由な遊びが減り、活動が指示や課題に偏っている。/ 遊びへの意欲の低下: 子どもが遊びに興味を示さず、受動的になっている。/ 関係性の不安定さ: 他者との関わりがうまくいかず、遊びが孤立的・衝突的になっている。/ 遊びの評価化: 「うまくできる」「成果を出す」ことが目的化し、遊びの本質が失われている。", design: "赤いチュニックと青い襟の衣装：情熱と集中を象徴。遊びへの没頭と創造性を表現。/ 積み木を積み上げる姿：構築・創造・試行錯誤の象徴。遊びが学びの土台であることを示す。/ 手に持つ棒付きおもちゃとボール：運動・リズム・感覚統合の象徴。/ 円形模様の敷物：遊びの場が「秩序と循環」を持つことを示唆。/ 赤・青・黄の積み木：三原色による創造性と発達の多様性。/ 花と植物：遊びが生命力と成長を促すことの象徴。/ 青空と太陽：開かれた世界と遊びの自由。/ 木と草花：遊びが自然とつながることを示す。", img: "22", vector: [0.98 , 0.90 , 0.85 , 0.90 , 0.85 , 0.50 , 0.98 , 0.60 , 0.70 , 0.70 , 0.80 , 0.85 , 0.40 , 0.85 , 0.88 ] },
            { id: 23, name: "学び", latin: "DISCERE", dmin: "環境/言葉", philo: "「学びとは、発見と驚きの積み重ねであり、思考を通じて世界とつながる営みである」。子どもが環境に触れ、観察し、考え、理解する過程そのものが学びの象徴です。", regpo: "探究心が芽生えている：子どもが「なぜ？」「どうして？」と問いを持ち始める。/ 思考の芽生え：観察・比較・推論など、認知的な働きが自然に育まれる。/ 試行錯誤を楽しむ：失敗を恐れず、繰り返し挑戦する姿勢。/ 理解の深まり：経験が意味づけられ、知識として定着し始める。/ 他者との学びの共有：友だちや保育者との対話を通じて学びが広がる。", revpo: "表面的な理解：活動が「やらされ感」になり、深い思考につながらない。/ 探究心の停滞：好奇心が十分に引き出されず、学びが受動的になる。興味が持てず、活動に参加しない。/ 混乱や誤解：情報が多すぎたり整理されず、子どもが混乱する。/ 成果への過度な期待：結果を求めすぎて、過程を楽しむ余裕が失われる。/ 理解の断片化：経験がつながらず、意味づけが不十分。/ 過度な不安や失敗回避：挑戦を避け、学びの機会を逃す。/ 模倣に偏る：自発性が乏しく、他者の真似に終始する。/ 環境との断絶：物や空間に働きかける意欲が低下している。", design: "中央の子ども - 花を観察する姿勢：発見と探究の象徴。/ 本を膝に置きながら思索する表情：思考と認知の統合。/ 赤と青の衣装：情熱（赤）と知性（青）の調和。/ 周囲のモチーフ - 太陽の顔と光線：知の照らしと気づきの瞬間。/ 蝶と植物：変容と成長の象徴。/ 草地と木製の椅子：安定した学びの場。", img: "23", vector: [0.75 , 0.85 , 0.70 , 0.70 , 0.55 , 0.70 , 0.75 , 0.75 , 0.65 , 0.65 , 0.75 , 0.65 , 0.35 , 0.80 , 0.70 ] },
            { id: 24, name: "身体", latin: "CORPVS", dmin: "健康", philo: "「身体とは、感覚と健康の土台であり、世界との最初の接点である」。子どもが自分の身体を感じ、動かし、守ることで、発達のすべてが始まります。身体は単なる器ではなく、自然・宇宙・他者との関係性の中心です。", regpo: "身体への気づきと尊重: 子どもが自分の身体に意識を向け、動きや感覚を楽しんでいる。/ 健康と安定の基盤: 呼吸・循環・姿勢などが安定し、身体が安心の場にある。/ 自然との調和: 裸足で地面に立つ、風を感じるなど、身体を通じて自然とつながっている。/ 発達の準備状態: 身体が整っていることで、遊び・学び・関係性への準備ができている。", revpo: "身体への無関心または過敏: 自分の身体に気づけず、動きがぎこちない／逆に過剰に反応してしまう。/ 健康の不安定さ: 疲れや不調、姿勢の崩れなどが、活動や情緒に影響している。/ 自然との断絶: 室内中心の生活で、身体が自然のリズムから切り離されている。/ 発達の停滞: 身体の準備が整っておらず、遊びや学びに入りづらい状態。", design: "中央の子どもの赤いチュニック・青いレギンス・黄色の縁取り：血流（赤）、呼吸（青）、自然との調和（黄）を色彩で表現。/ 裸足で草地に立つ姿：地面との接触を通じた身体感覚の象徴。/ 目を閉じて深呼吸する姿勢：内的な身体意識と安定感。手を胸に添えることで「自分の身体を感じる」瞬間を強調。/ 心臓・肺・骨のアイコン：中世医学風の図像で、身体の内的構造を可視化。/ 太陽・水・木・石の四元素：身体を支える自然環境の象徴。子どもを囲むように配置され、保育における「環境としての身体支援」を示唆。/ 丘と小川、星のアーチ：身体が宇宙とつながっているという感覚。発達が自然と調和していることを示す。/ 草地に咲く赤い花々：健康と成長の象徴。足元に咲くことで「身体の根源的な力」を表現。", img: "24", vector: [0.70 , 0.60 , 0.65 , 0.55 , 0.95 , 0.65 , 0.70 , 0.80 , 0.40 , 0.70 , 0.75 , 0.80 , 0.35 , 0.75 , 0.65 ] },
            { id: 25, name: "響き", latin: "SONVS", dmin: "表現", philo: "「響きとは、音を通じて世界とつながり、心と身体を調和させる営みである」。子どもが音を鳴らし、聴き、感じることで、感性と身体が育まれていきます。", regpo: "音への感受性：子どもが音を聴き、感じ、楽しむ姿。自然音や楽器の響きに心を開く。/ 身体と音の調和：太鼓を叩く、歌う、踊るなど、身体表現と音が結びつく。/ 共同のリズム：仲間と一緒に音を鳴らすことで、協調性や一体感が育まれる。/ 感情の解放：音を通じて喜びや安心を表現し、情緒の安定につながる。", revpo: "音への拒否や過敏：大きな音や不規則な響きに不安を感じる。/ 調和の乱れ：リズムが合わず、集団活動での一体感が得られにくい。/ 表現の停滞：音を楽しむ余裕がなく、活動が受動的になる。/ 環境の不整合：騒音や不快な音が多く、安定した感覚体験が難しい。", design: "中央の子ども - 金色のリラ（竪琴）を奏でる姿：音楽活動の中心。/ 穏やかな表情と閉じた目：音に浸る感性と内的な集中。/ 赤と青の衣装：情熱（赤）と静けさ（青）の調和。/ 周囲のモチーフ - 音の波紋（金色の曲線）：響きが広がる様子を視覚化。/ 歌う鳥と木の鈴：自然の音との共鳴。/ 星の浮かぶ夜空：静寂の中で音が際立つ環境。", img: "25", vector: [0.70 , 0.60 , 0.75 , 0.85 , 0.60 , 0.60 , 0.80 , 0.75 , 0.60 , 0.55 , 0.75 , 0.75 , 0.30 , 0.75 , 0.75 ] },
            { id: 26, name: "手", latin: "MANVS", dmin: "健康/表現", philo: "「手とは、世界を形づくる最も身近な道具であり、創造と秩序の起点である」。子どもが手を使って素材に触れ、形を変え、意味を与えることで、自己表現と集中力が育まれます。", regpo: "器用さと集中力の発揮: 手先を使った活動に没頭し、細かな操作ができる状態。/ 創造の実践: 折る・切る・貼る・描くなど、手を通じてアイデアが形になる。/ 素材との対話: 手で触れることで、素材の性質を理解し、工夫が生まれる。/ 達成感と自己効力感: 「自分の手でできた」という実感が、自己肯定感につながる。", revpo: "不器用さや焦り: 細かな作業がうまくいかず、苛立ちや自信の低下が起きている。/ 手の使い方への不安: 道具の扱いに戸惑い、活動への意欲が下がっている。/ 過度な干渉や指示: 大人の手が先に動いてしまい、子どもの手の自由が奪われている。/ 完成へのこだわり: 「うまく作ること」が目的化し、創造の楽しさが失われている。", design: "右手が大きく描かれ、指先を繊細に表現。微細運動の中心である「手」の象徴。指の曲がりや関節の陰影が、器用さと集中力を示す。/ 手の周囲に糸や道具が絡むように配置され、手が「創造の道具」として世界と関わっていることを示唆。/ 糸巻きとハサミ：縫う・切るといった細かな操作の象徴。/ 絵筆と絵具：描く・塗るという表現活動の象徴。/ 紙や布の切れ端：素材との関係性と、手を通じた変化の可能性。", img: "26", vector: [0.75 , 0.70 , 0.65 , 0.80 , 0.85 , 0.65 , 0.80 , 0.75 , 0.85 , 0.60 , 0.70 , 0.70 , 0.30 , 0.80 , 0.65 ] },
            { id: 27, name: "声", latin: "VOX", dmin: "言葉", philo: "「声とは、内なる世界が外へと開かれる最初の橋である」。子どもが言葉を発し始めることで、感情・欲求・思考が外界とつながり、他者との関係が育まれていきます。", regpo: "発語の芽生え：言葉になり始める音、意味のある発声が見られる。/ 自己表現の始まり：自分の思いや欲求を声で伝えようとする意志。/ 関係への働きかけ：他者に向かって声を発することで関係が始まる。/ 環境との応答：音や言葉を通じて周囲とやりとりする姿勢。/ 情緒の表出：喜びや不満などが声に乗って現れる。", revpo: "発語の停滞：言葉が出にくく、発声が乏しい。/ 自己表現の抑制：思いや欲求を声に乗せることが難しい。/ 関係の閉じ：他者とのやりとりが声を通じて始まらない。/ 環境への反応の希薄化：音や言葉への応答が少ない。/ 情緒の沈黙：感情が声に乗らず、内面が閉じている。", design: "横顔で口を開いた子ども：声を発する瞬間を捉えた構図。横顔は「外に向かう意志」を象徴し、内面から外界への橋渡しを示します。口から放射状に伸びる音の線は、発語・表出・伝達の象徴。/ 赤と黄の衣装：赤＝情熱・生命力、黄＝光・可能性・言葉の芽生え → 声が感情と希望を乗せて発されることを示唆します。/ 顔のある太陽：声が「光をもたらすもの」「関係を照らすもの」であることを示します。太陽の表情は穏やかで、声が祝福されていることを暗示。 / 下部の装飾とモチーフ - 花＝声が育まれる環境の象徴 / ベル＝呼びかけ、注意喚起、声の始まり / トランペット＝力強い表出、自己の主張 / 小さな人物の声＝模倣・共鳴・声の連鎖 → これらのモチーフは、声が単なる音ではなく、関係・環境・文化の中で育まれるものであることを示しています。", img: "27", vector: [0.70 , 0.55 , 0.75 , 0.85 , 0.40 , 0.60 , 0.80 , 0.75 , 0.30 , 0.50 , 0.80 , 0.65 , 0.35 , 0.70 , 0.85 ] },
            { id: 28, name: "繋がり", latin: "CONEXIO", dmin: "人間関係", philo: "「繋がりとは、互いの存在を認め合い、信頼と共感を通じて関係を育てていく営みである」", regpo: "信頼が育まれている：子ども同士、あるいは保育者との間に安心感がある。/ 共感的なやりとり：言葉・表情・行動を通じて互いに気持ちを受け止め合う。/ 協力や共有が生まれている：遊びや活動の中で、役割分担や助け合いが見られる。/ 関係の継続性：一時的な関わりではなく、継続的な絆が育っている。/ 環境との調和：人との関係だけでなく、場や物との関係も安定している。", revpo: "孤立感がある：他者との関わりが希薄で、ひとりで過ごす時間が多い。/ 共感の不足：気持ちが伝わらず、すれ違いや衝突が起きやすい。/ 関係の断絶：一度築いた関係が途切れてしまう、または築けない。/ 環境との不一致：場や物との関係が不安定で、落ち着かない様子が見られる。/ 関係への不安や拒否：関わりを避けたり、拒否的な態度が見られる。", design: "中央の子どもたち - 向かい合う2人の子ども：互いを見つめる姿が、相互理解と信頼の象徴。/ 手にしたリボンで結ばれる姿：絆と関係性の可視化。リボンは中央で結ばれ、両者を柔らかく繋いでいます。/ 補色の衣装（緑と橙）：多様性と調和の象徴。色の違いが関係の豊かさを表現。 / 周囲のモチーフ - 絡み合う枝の木：背景に描かれた木の枝が交差しながら伸び、関係が育つ場を象徴。/ 握手・ハート型のロケット・星の輪：信頼、共感、一体感の象徴。/ 朝日と花咲く野原：関係の始まりと広がり。", img: "28", vector: [0.65 , 0.55 , 0.90 , 0.75 , 0.50 , 0.65 , 0.80 , 0.75 , 0.40 , 0.60 , 0.85 , 0.60 , 0.35 , 0.75 , 0.90 ] },
            { id: 29, name: "小さな勇気", latin: "FORTITVDO MINOR", dmin: "情緒/健康", philo: "「小さな勇気とは、日常の中で自分の限界に一歩踏み出す力であり、成長の原動力である」。子どもが新しいことに挑戦する瞬間は、見過ごされがちですが、そこには深い意志と発達の鍵が宿っています。", regpo: "段階的な挑戦への意欲: 子どもが自分のペースで新しいことに挑戦しようとしている。/ 不安と希望の共存: 少し怖いけれど「やってみたい」という気持ちが前に出ている。/ 自律性の芽生え: 大人の手を借りず、自分で一歩を踏み出そうとする姿勢。/ 日常の中の達成感: 靴を履く、階段を登る、初めての道具を使うなど、小さな成功が積み重なっている。", revpo: "挑戦への不安や回避: 新しいことに対して強い不安があり、避けようとしている。/ 自信の揺らぎ: 「できないかも」「失敗したらどうしよう」という気持ちが前に出ている。/ 過度な保護や介入: 大人が先回りしてしまい、子どもの挑戦の機会が奪われている。/ 挑戦の強制化: 「やらなきゃ」「できて当然」といったプレッシャーが、勇気を萎縮させている。", design: "石段を一歩ずつ登る姿：挑戦の段階性と、日常の中で育まれる勇気を象徴。/ 赤いチュニックと青い袖、黄色のタイツ：情熱・集中・希望の三原色が、内面の力を表現。/ 表情は真剣で、足元を見つめながらバランスを取る姿勢：不安と意志が同居する「小さな勇気」の瞬間。/ 石段の質感と草の根元：挑戦が「自然な成長の延長」であることを示す。/ 背景の太陽と木：挑戦の先にある希望と、見守る存在の象徴。", img: "29", vector: [0.80 , 0.70 , 0.65 , 0.70 , 0.70 , 0.60 , 0.75 , 0.70 , 0.50 , 0.50 , 0.70 , 0.70 , 0.45 , 0.85 , 0.70 ] },
            { id: 30, name: "安らぎ", latin: "PAX", dmin: "情緒", philo: "「安らぎとは、子どもが安心して身を委ねられる場であり、心身の安定を育む基盤である」。保育において、安らぎの時間は活動と活動の間をつなぎ、子どもの情緒を支える大切な瞬間です。", regpo: "安心できる場：子どもが心身を休め、安心して身を委ねられる環境。/ 情緒の安定：活動と活動の間にくつろぎの時間があることで、気持ちが落ち着く。/ 信頼関係の基盤：保育者や仲間との関わりの中で「守られている」という感覚が育つ。/ 回復と充電：休息を通じて次の活動へのエネルギーを蓄える。", revpo: "落ち着けない環境：騒がしさや不安要素が多く、子どもが安心できない。/ 情緒の不安定：休息の機会が不足し、気持ちが揺れやすくなる。/ 信頼の揺らぎ：安心の場が確保されず、保育者や仲間との関係に不安が生じる。/ 疲労や緊張の蓄積：休むことができず、次の活動への意欲が低下する。", design: "中央の子ども - 眠る姿：横たわり、目を閉じて穏やかに眠る姿が、情緒の安定と安心感を象徴。/ 手を胸に添えた姿勢：自己への信頼と保護の感覚。内的な安心が外に表れている。/ 青い衣と赤い毛布：冷静さ（青）と温もり（赤）の調和。情緒のバランスを色彩で表現。/ 周囲のモチーフ - 天使の顔と翼：カード上部に描かれ、子どもを見守る存在として包容と安心を象徴。/ 夜空と星：背景に広がる夜空に星が散りばめられ、静けさと時間の流れを表現。", img: "30", vector: [0.50 , 0.30 , 0.70 , 0.50 , 0.40 , 0.75 , 0.70 , 0.85 , 0.40 , 0.75 , 0.95 , 0.25 , 0.15 , 0.65 , 0.80 ] },
            { id: 31, name: "真似っこ", latin: "IMITATIO", dmin: "人間関係", philo: "「模倣とは、学びの最初のかたちであり、関係性の中で育まれる創造の種である」。子どもが大人や仲間の動きを真似ることで、身体・言葉・感情・思考のすべてが育まれていきます。模倣は単なる再現ではなく、理解とつながりの入り口です。", regpo: "模倣による学びの活性化: 子どもが保育者や仲間の動きを自然に模倣し、理解と習得が進んでいる。/ 関係性の中で育まれる模倣: 信頼や安心の場で、模倣が共感やつながりの手段として機能している。/ 身体的・言語的発達の促進: 手遊び、言葉の繰り返し、表情の模倣などを通じて、発達が支えられている。/ 遊びの中での自然な模倣: 模倣が強制ではなく、遊びの流れの中で自発的に行われている。", revpo: "模倣の停滞や拒否: 他者の動きに興味を示さず、模倣が起きにくい状態。/ 関係性の不安定さ: 信頼関係が築かれていないため、模倣がぎこちなく、表面的になっている。/ 模倣の強制や形式化: 「こうしなさい」「真似しなさい」といった指示が先行し、模倣が学びではなく義務になっている。/ 模倣の誤解や混乱: 子どもが模倣した内容が誤って受け取られたり、否定されたりすることで、混乱や萎縮が生じている。", design: "保育者と子どもが向かい合い、手の形を鏡のように一致させている：模倣が関係性の中で自然に育まれることを示す。/ 保育者の表情は穏やかで導くように、子どもは好奇心に満ちた眼差し：模倣が信頼と共感の中で行われることを象徴。/ 影絵や手遊びの道具（縄、動物のシルエット）：遊びの中で模倣が行われることを示す。/ 木と丘の穏やかな風景は模倣が安心の場で行われることを示し、柔らかな光と空の広がりは模倣が未来への学びにつながることを象徴。", img: "31", vector: [0.70 , 0.60 , 0.90 , 0.80 , 0.70 , 0.40 , 0.85 , 0.75 , 0.50 , 0.50 , 0.75 , 0.65 , 0.30 , 0.70 , 0.88 ] },
            { id: 32, name: "温かさ", latin: "CALOR", dmin: "情緒", philo: "「温かさとは、応答的な関係の中で育まれる情緒的な安心であり、子どもの心の根を支える力である」。抱きしめる、見つめる、寄り添うといった行為の中に、子どもは「自分は大切にされている」という感覚を得て、情緒の安定と社会性の土台が築かれていきます。", regpo: "信頼が育まれている：子ども同士、あるいは保育者との間に安心感がある。/ 共感的なやりとり：言葉・表情・行動を通じて互いに気持ちを受け止め合う。/ 協力や共有が生まれている：遊びや活動の中で、役割分担や助け合いが見られる。/ 関係の継続性：一時的な関わりではなく、継続的な絆が育っている。/ 環境との調和：人との関係だけでなく、場や物との関係も安定している。", revpo: "孤立感がある：他者との関わりが希薄で、ひとりで過ごす時間が多い。/ 共感の不足：気持ちが伝わらず、すれ違いや衝突が起きやすい。/ 関係の断絶：一度築いた関係が途切れてしまう、または築けない。/ 環境との不一致：場や物との関係が不安定で、落ち着かない様子が見られる。/ 関係への不安や拒否：関わりを避けたり、拒否的な態度が見られる。", design: "親子の姿 - 抱き合う母子：応答的関わりと情緒的温もりの核心。/ 青い衣の親と赤＋金の子ども：安らぎ（青）、愛情（赤）、未来への光（金）。周囲のモチーフ - 微笑む太陽：祝福と温かさの源。/ 木と花咲く野原：自然との調和と成長の場。/ 小丘と階段：未来へ続く道。", img: "32", vector: [0.50 , 0.40 , 0.80 , 0.60 , 0.45 , 0.70 , 0.75 , 0.85 , 0.35 , 0.70 , 0.95 , 0.50 , 0.25 , 0.65 , 0.90 ] },
            { id: 33, name: "笑顔", latin: "RIDENS", dmin: "情緒/人間関係", philo: "「笑顔とは、子どもが安心し、関係の中で情緒的に満たされていることの指標である」", regpo: "情緒の安定：子どもが安心し、穏やかな気持ちで過ごしている状態。/ 関係性の成熟：仲間との関係が安定し、協調的な関わりが生まれている。/ 信頼の可視化：保育者との信頼関係が笑顔として表出されている。/ 場の温かさ：保育環境が情緒的に満たされており、安心して活動できる。/ 共感と調和：他者の気持ちに寄り添い、自然な笑顔が生まれる関係性。", revpo: "情緒の揺らぎ：不安や緊張があり、笑顔が減っている。/ 関係の不安定さ：仲間との関係に摩擦や距離が生じている。/ 信頼の欠如：保育者との関係に不安があり、安心感が得られていない。/ 場の冷たさ：環境が情緒的に満たされておらず、孤立感が生まれやすい。/ 表面的な笑顔：本来の安心感が欠けており、笑顔が「演技」になっている可能性。", design: "中央の子どもたち - 輪になって手をつなぐ3人の子ども：関係性の安定と協調の象徴。/ 笑顔の表情：情緒の安定、安心感、信頼の表れ。/ 暖色系の衣装（黄・桃・水色）：温かさと安心を感じさせる色彩。/ 周囲のモチーフ - 優しい顔の太陽：見守りと情緒的な温もり。/ 飛び交う2羽の鳩：平和とつながりの象徴。/ 咲き誇る花々と虹：情緒の豊かさと関係の広がり。", img: "33", vector: [0.60 , 0.50 , 0.85 , 0.70 , 0.50 , 0.55 , 0.80 , 0.75 , 0.30 , 0.50 , 0.90 , 0.70 , 0.25 , 0.80 , 0.88 ] },
            { id: 34, name: "共鳴", latin: "RESONANTIA", dmin: "人間関係", philo: "「共鳴とは、他者の内面に触れ、自分の感情が響き合う瞬間である」。子どもと保育者が互いの存在を感じ合い、言葉や行動を超えて心がつながることで、深い安心と信頼が育まれます。", regpo: "感性が響き合っている：言葉・音・表情・動作などが互いに呼応している。/ 関係が調和している：相手の存在に応じて、自分の表現が自然に変化する。/ 表現が連動している：音楽・遊び・対話などで、互いの表現がつながっている。/ 共感的な交流がある：気持ちや意図が伝わり、受け止め合う関係が育っている。/ 環境との一体感：場や物との関係も含めて、全体が調和している。", revpo: "感性の断絶：互いの表現がすれ違い、響き合わない。/ 関係の不調和：相手の存在に応じた変化が起きず、固定的なやりとりになる。/ 表現の孤立：自分の表現が周囲とつながらず、独立している。/ 共感の不足：気持ちや意図が伝わらず、誤解や衝突が起きやすい。/ 環境との違和感：場や物との関係が不安定で、落ち着かない。", design: "保育者と子どもが向かい合い、音楽を通じてつながっている構図：共鳴とは、言葉を超えた感情の響き合い。/ 保育者の表情は穏やかで目を閉じ、子どもは目を開いて見つめている：内面の感受と外界への開きが交差する瞬間。/ 子どもが奏でるリュート（弦楽器）：共感が「響き」として現れる象徴。/ 楽器（リュート、風鈴）：音の共鳴が心の共鳴を象徴。/ 手のジェスチャーの一致：身体的な共感と関係性の調和。/ 双子の木と共有されたベンチ：対等な関係性と安心の場。/ 青空と太陽：明るく開かれた世界。共感が未来へとつながることを示す。/ 丘と草花：共鳴が育まれる穏やかな環境。", img: "34", vector: [0.60 , 0.50 , 0.92 , 0.78 , 0.48 , 0.68 , 0.82 , 0.78 , 0.38 , 0.62 , 0.88 , 0.58 , 0.32 , 0.78 , 0.92 ] },
            { id: 35, name: "思いやり", latin: "CONSIDERATIONE", dmin: "人間関係", philo: "「思いやりとは、他者との関係の中で育まれる道徳的な感受性であり、行動として現れる心の力である」。子どもが誰かを気遣い、助け、分かち合うことで、社会性と倫理性が育まれていきます。", regpo: "他者への気づきと配慮: 子どもが相手の気持ちを察し、優しく接することができている。/ 道徳性の芽生え: 「してあげたい」「助けたい」という気持ちが自然に行動に表れている。/ 関係性の成熟: 相手との違いを受け入れ、共感や協力が生まれている。/ 安心の場で育まれる優しさ: 思いやりが強制ではなく、信頼の中で育っている。", revpo: "気づきの欠如: 他者の気持ちに気づけず、無意識に傷つけてしまうことがある。/ 道徳性の混乱: 「やらなきゃ」「褒められたい」という動機が先行し、本質的な思いやりが薄れている。/ 関係性の不安定さ: 相手との距離感がつかめず、関係がぎこちなくなっている。/ 優しさの押しつけ: 「良い子でいなきゃ」というプレッシャーが、自由な感情表現を妨げている。", design: "保育者が子どもの頭に手を添える姿：優しさと導きの象徴。身体的な接触が安心と信頼を生む。/ 子どもが花を差し出す仕草：思いやりの行動を自発的に示す象徴。贈与と共感の芽生え。/ 互いの視線が交差する構図：関係性の中で育まれる道徳性と感情のつながり。/ 赤い花と緑の葉：生命力と感情の豊かさ。思いやりが育つ環境の象徴。/ 手を胸に置く仕草：内面の誠実さと他者への配慮を示す。/ 穏やかな丘と柔らかな空：安心の場。思いやりが自然に育まれる環境。/ 小さな茂みや鳥の巣：育てる・守る・分かち合うという関係性の象徴。", img: "35", vector: [0.65 , 0.50 , 0.90 , 0.70 , 0.40 , 0.70 , 0.75 , 0.80 , 0.30 , 0.65 , 0.85 , 0.50 , 0.45 , 0.70 , 0.90 ] },

        // コサイン類似度計算
        function cosineSimilarity(vecA, vecB) {
            const dotProduct = vecA.reduce((sum, a, i) => sum + a * vecB[i], 0);
            const normA = Math.sqrt(vecA.reduce((sum, a) => sum + a * a, 0));
            const normB = Math.sqrt(vecB.reduce((sum, b) => sum + b * b, 0));
            return dotProduct / (normA * normB);
        }

        // 全ペアの相性を計算
        function calculateAllCompatibilities() {
            const compatibilities = [];
            for (let i = 0; i < CARDS.length; i++) {
                for (let j = i + 1; j < CARDS.length; j++) {
                    const similarity = cosineSimilarity(CARDS[i].vector, CARDS[j].vector);
                    compatibilities.push({
                        cardA: CARDS[i],
                        cardB: CARDS[j],
                        similarity: similarity
                    });
                }
            }
            return compatibilities;
        }

        const allCompatibilities = calculateAllCompatibilities();

        // 状態
        let searchTerm = '';
        let sortOrder = 'desc';
        let filterCard = null;
        let selectedPair = null;

        // DOM要素
        const searchInput = document.getElementById('searchInput');
        const filterSelect = document.getElementById('filterSelect');
        const sortBtn = document.getElementById('sortBtn');
        const tableBody = document.getElementById('compatibilityTable');
        const modal = document.getElementById('modal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalBody = document.getElementById('modalBody');
        const totalPairsEl = document.getElementById('totalPairs');
        const displayedPairsEl = document.getElementById('displayedPairs');
        const maxSimilarityEl = document.getElementById('maxSimilarity');
        const minSimilarityEl = document.getElementById('minSimilarity');

        // フィルタセレクトの初期化
        CARDS.forEach(card => {
            const option = document.createElement('option');
            option.value = card.id;
            option.textContent = `${card.id}.${card.name}`;
            filterSelect.appendChild(option);
        });

        // 色スタイル取得
        function getColorStyle(similarity) {
            if (similarity >= 0.97) return 'background: #faf5ff; color: #7c3aed;';
            if (similarity >= 0.95) return 'background: #eff6ff; color: #1e40af;';
            if (similarity >= 0.90) return 'background: #f0fdf4; color: #166534;';
            if (similarity >= 0.85) return 'background: #fef3c7; color: #ca8a04;';
            if (similarity >= 0.80) return 'background: #fed7aa; color: #c2410c;';
            return 'background: #fee2e2; color: #dc2626;';
        }

        // 活動例取得
        function getActivityExample(cardA, cardB, similarity) {
            if (similarity >= 0.98) {
                return `${cardA.name}と${cardB.name}は極めて相性が良く、同時展開が理想的です。`;
            } else if (similarity >= 0.95) {
                return `${cardA.name}と${cardB.name}は非常に相性が良く、連続的な活動に最適です。`;
            } else if (similarity >= 0.90) {
                return `${cardA.name}と${cardB.name}は相性が良く、組み合わせやすい活動です。`;
            } else if (similarity >= 0.80) {
                return `${cardA.name}と${cardB.name}はやや工夫が必要ですが組み合わせ可能です。`;
            } else {
                return `${cardA.name}と${cardB.name}は対比的です。時間を分けて配置すると効果的。`;
            }
        }

        // フィルタとソートされたリスト取得
        function getFilteredAndSorted() {
            let filtered = [...allCompatibilities];

            // カードフィルタ
            if (filterCard !== null) {
                filtered = filtered.filter(comp => 
                    comp.cardA.id === filterCard || comp.cardB.id === filterCard
                );
            }

            // 検索フィルタ
            if (searchTerm) {
                filtered = filtered.filter(comp =>
                    comp.cardA.name.includes(searchTerm) || comp.cardB.name.includes(searchTerm)
                );
            }

            // ソート
            return filtered.sort((a, b) => 
                sortOrder === 'desc' ? b.similarity - a.similarity : a.similarity - b.similarity
            );
        }

        // テーブルレンダー
        function renderTable() {
            const filteredAndSorted = getFilteredAndSorted();
            tableBody.innerHTML = '';
            filteredAndSorted.forEach((comp, index) => {
                const row = document.createElement('tr');
                row.className = 'cursor-pointer';
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${comp.cardA.id}.${comp.cardA.name}</td>
                    <td>${comp.cardB.id}.${comp.cardB.name}</td>
                    <td style="text-align: center;">
                        <span class="similarity" style="${getColorStyle(comp.similarity)}">${comp.similarity.toFixed(3)}</span>
                    </td>
                    <td>
                        <button class="detail-btn" onclick="showDetail(${comp.cardA.id}, ${comp.cardB.id})">詳細を見る</button>
                    </td>
                `;
                row.addEventListener('click', () => showDetail(comp.cardA.id, comp.cardB.id));
                tableBody.appendChild(row);
            });
            displayedPairsEl.textContent = filteredAndSorted.length;
        }

                    <canvas id="canvas" width="300" height="124"></canvas>

// ◆コサイン類似度の角度表示start◆
// 矢印を描く関数（線の一方の端に矢印頭を付ける）
function drawArrow(ctx, fromX, fromY, toX, toY, arrowSize = 18) {
  const angle = Math.atan2(toY - fromY, toX - fromX);
  const dist = Math.hypot(toX - fromX, toY - fromY);

  // 矢印頭の位置（線を少し短くして重なりを防ぐ）
  const headX = fromX + (toX - fromX) * (dist - arrowSize * 0.2) / dist;
  const headY = fromY + (toY - fromY) * (dist - arrowSize * 0.2) / dist;

  // 線本体
  ctx.beginPath();
  ctx.moveTo(fromX, fromY);
  ctx.lineTo(headX, headY);
  ctx.stroke();

  // 矢印頭（2本の短い線）
  ctx.beginPath();
  ctx.moveTo(toX, toY);
  ctx.lineTo(toX - arrowSize * Math.cos(angle - Math.PI/6), toY - arrowSize * Math.sin(angle - Math.PI/6));
  ctx.moveTo(toX, toY);
  ctx.lineTo(toX - arrowSize * Math.cos(angle + Math.PI/6), toY - arrowSize * Math.sin(angle + Math.PI/6));
  ctx.stroke();
}
